  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>\n  :root{\n    --bg:#04060c;\n    --fg:#ffffff;\n    --fg-2:#c9d1de;\n    --fg-dim:rgba(255,255,255,0.45);\n    --line:rgba(255,255,255,0.08);\n    --grid:rgba(124,180,255,0.05);\n    --accent:#3a7bff;\n    --cyan:#7cdcff;\n    --type:'Space Grotesk',-apple-system,sans-serif;\n    --type-display:'Chakra Petch','Space Grotesk',sans-serif;\n    --type-mono:'JetBrains Mono',ui-monospace,monospace;\n  }\n  *{box-sizing:border-box;margin:0;padding:0}\n  html,body{height:100%;background:var(--bg);color:var(--fg);font-family:var(--type);overflow:hidden;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;}\n  body{\n    background:\n      radial-gradient(80% 60% at 50% 50%, #0a1226 0%, #050811 55%, #02040a 100%);\n  }\n\n  /* ── Technical grid backdrop (fills the void) ───── */\n  .techgrid{\n    position:fixed;inset:0;z-index:0;pointer-events:none;\n    background-image:\n      linear-gradient(to right, var(--grid) 1px, transparent 1px),\n      linear-gradient(to bottom, var(--grid) 1px, transparent 1px);\n    background-size: 80px 80px;\n    mask-image:radial-gradient(80% 70% at 50% 50%, #000 30%, transparent 100%);\n    -webkit-mask-image:radial-gradient(80% 70% at 50% 50%, #000 30%, transparent 100%);\n  }\n\n  /* ── Top nav ─────────────────────────────────────── */\n  .nav{\n    position:fixed;top:0;left:0;right:0;z-index:10;\n    display:flex;justify-content:space-between;align-items:center;\n    padding:26px 5vw;\n  }\n  .nav .brand{display:flex;align-items:center;gap:14px}\n  .nav .brand .mark{\n    width:24px;height:24px;display:inline-block;\n    background-color:var(--fg);\n    -webkit-mask:url(\"513fb3fb-e1b4-42c8-8cbf-9af4ecd2827d\") center/contain no-repeat;\n            mask:url(\"513fb3fb-e1b4-42c8-8cbf-9af4ecd2827d\") center/contain no-repeat;\n  }\n  .nav .brand .wordmark{\n    font-family:var(--type-display);font-size:14px;font-weight:600;\n    letter-spacing:0.28em;color:var(--fg);text-decoration:none;\n    text-transform:uppercase;\n  }\n  .cta{\n    display:inline-flex;align-items:center;gap:14px;\n    padding:13px 24px;\n    background:var(--accent);color:#fff;text-decoration:none;\n    font-family:var(--type-display);font-size:12px;font-weight:600;\n    letter-spacing:0.22em;text-transform:uppercase;\n    border:none;border-radius:0;\n    white-space:nowrap;\n    transition:background .15s ease, transform .15s ease, box-shadow .25s ease;\n  }\n  .cta:hover{background:#5b95ff;transform:translateY(-1px);box-shadow:0 0 32px rgba(58,123,255,0.45)}\n  .cta .arrow{width:16px;height:1.5px;background:#fff;position:relative}\n  .cta .arrow::after{content:\"\";position:absolute;right:0;top:-3.5px;width:8px;height:8px;border-top:1.5px solid #fff;border-right:1.5px solid #fff;transform:rotate(45deg)}\n\n  /* ── Stage ─────────────────────────────────────── */\n  canvas#scene{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:1}\n\n  /* ── Annotations (fill the void with technical detail) ── */\n  .annotations{\n    position:fixed;inset:0;z-index:3;pointer-events:none;\n    font-family:var(--type-mono);font-size:10px;letter-spacing:0.18em;text-transform:uppercase;\n    color:var(--fg-dim);\n  }\n  .annotation{position:absolute;display:flex;align-items:center;gap:8px;opacity:0;animation:fadeIn 1s ease forwards}\n  .annotation .dash{width:24px;height:1px;background:rgba(124,220,255,0.4)}\n  .annotation .label{display:flex;flex-direction:column;gap:3px}\n  .annotation .label .k{color:rgba(255,255,255,0.35);font-size:9px}\n  .annotation .label .v{color:var(--fg-2);font-variant-numeric:tabular-nums}\n  .annotation.tl{top:18%;left:8%;animation-delay:1.6s}\n  .annotation.tr{top:24%;right:8%;animation-delay:1.8s;flex-direction:row-reverse}\n  .annotation.tr .label{align-items:flex-end}\n\n  /* Vector ticks — technical depth in the corners */\n  .ticks{\n    position:fixed;inset:0;z-index:2;pointer-events:none;\n  }\n  .ticks svg{position:absolute;color:rgba(124,180,255,0.22)}\n  .ticks .tl{top:80px;left:5vw;width:120px;height:120px}\n  .ticks .br{bottom:90px;right:5vw;width:160px;height:120px}\n\n  /* ── Hero: anchored bottom-left, futuristic type ─ */\n  .hero{\n    position:absolute;\n    left:5vw;right:5vw;\n    bottom:13vh;\n    z-index:5;\n    pointer-events:none;\n  }\n  .hero .meta{\n    display:flex;align-items:center;gap:10px;\n    font-family:var(--type-mono);font-size:11px;letter-spacing:0.28em;text-transform:uppercase;\n    color:var(--fg-dim);\n    margin-bottom:28px;\n    opacity:0;animation:fadeUp 1s ease .3s forwards;\n  }\n  .hero .meta .num{color:var(--cyan);font-weight:500}\n  .hero .meta .bar{width:42px;height:1px;background:linear-gradient(90deg, var(--cyan), transparent)}\n\n  h1{\n    font-family:var(--type-display);\n    font-weight:300;                    /* light by default — weight CONTRAST sells the futuristic feel */\n    font-size:clamp(56px, 9.5vw, 168px);\n    letter-spacing:-0.02em;\n    line-height:0.92;\n    color:var(--fg);\n    text-transform:uppercase;\n  }\n  h1 .word{display:block;overflow:hidden;padding:0 0 .12em;}\n  h1 .word > span{\n    display:inline-block;\n    transform:translateY(110%);\n    animation:rise 1.0s cubic-bezier(.2,.7,.2,1) forwards;\n  }\n  h1 .word:nth-child(1) > span{animation-delay:.5s; letter-spacing:0.04em; font-weight:300; color:var(--fg-2)}\n  h1 .word:nth-child(2) > span{animation-delay:.66s; letter-spacing:-0.035em; font-weight:600}\n  h1 .future-period{color:var(--cyan)}\n\n  @keyframes rise{to{transform:translateY(0)}}\n  @keyframes pulse{0%,100%{opacity:1}50%{opacity:0.35}}\n  @keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}\n  @keyframes fadeIn{to{opacity:1}}\n\n  /* ── Bottom strip ────────────────────────────────── */\n  .strip{\n    position:fixed;left:0;right:0;bottom:0;z-index:8;\n    display:flex;justify-content:flex-end;align-items:center;\n    padding:24px 5vw;\n    font-family:var(--type-mono);font-size:11px;font-weight:500;letter-spacing:0.22em;\n    color:var(--fg-dim);text-transform:uppercase;\n    opacity:0;animation:fadeUp 1.0s ease 1.0s forwards;\n  }\n  .strip .right{font-variant-numeric:tabular-nums}\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n\n\n\n<div class=\"techgrid\"><\u002Fdiv>\n<canvas id=\"scene\"><\u002Fcanvas>\n\n<!-- Vector ticks: faint technical detail in corners -->\n<div class=\"ticks\" aria-hidden=\"true\">\n  <svg class=\"tl\" viewBox=\"0 0 120 120\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1\">\n    <line x1=\"0\" y1=\"0.5\" x2=\"40\" y2=\"0.5\"><\u002Fline>\n    <line x1=\"0\" y1=\"0.5\" x2=\"0.5\" y2=\"40\"><\u002Fline>\n    <line x1=\"0\" y1=\"20\" x2=\"6\" y2=\"20\" opacity=\"0.6\"><\u002Fline>\n    <line x1=\"0\" y1=\"40\" x2=\"10\" y2=\"40\" opacity=\"0.6\"><\u002Fline>\n    <line x1=\"20\" y1=\"0\" x2=\"20\" y2=\"6\" opacity=\"0.6\"><\u002Fline>\n    <line x1=\"40\" y1=\"0\" x2=\"40\" y2=\"10\" opacity=\"0.6\"><\u002Fline>\n  <\u002Fsvg>\n  <svg class=\"br\" viewBox=\"0 0 160 120\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1\">\n    <line x1=\"160\" y1=\"119.5\" x2=\"120\" y2=\"119.5\"><\u002Fline>\n    <line x1=\"159.5\" y1=\"120\" x2=\"159.5\" y2=\"80\"><\u002Fline>\n    <line x1=\"160\" y1=\"100\" x2=\"154\" y2=\"100\" opacity=\"0.6\"><\u002Fline>\n    <line x1=\"160\" y1=\"80\" x2=\"150\" y2=\"80\" opacity=\"0.6\"><\u002Fline>\n    <line x1=\"140\" y1=\"120\" x2=\"140\" y2=\"114\" opacity=\"0.6\"><\u002Fline>\n    <line x1=\"120\" y1=\"120\" x2=\"120\" y2=\"110\" opacity=\"0.6\"><\u002Fline>\n  <\u002Fsvg>\n<\u002Fdiv>\n\n<nav class=\"nav\">\n  <div class=\"brand\">\n    <a href=\"mailto:admin@xafron.nl\" aria-label=\"Xafron\" class=\"mark\"><\u002Fa>\n    <a class=\"wordmark\" href=\"mailto:admin@xafron.nl\">XAFRON<\u002Fa>\n  <\u002Fdiv>\n  <a class=\"cta\" href=\"mailto:admin@xafron.nl\">\n    Start a project\n    <span class=\"arrow\"><\u002Fspan>\n  <\u002Fa>\n<\u002Fnav>\n\n<section class=\"hero\">\n  <h1>\n    <span class=\"word\"><span>Creating<\u002Fspan><\u002Fspan>\n    <span class=\"word\"><span>the future<span class=\"future-period\">.<\u002Fspan><\u002Fspan><\u002Fspan>\n  <\u002Fh1>\n<\u002Fsection>\n\n<div class=\"strip\">\n  <div class=\"right\"><span id=\"clock\">—<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n\n<script>\n/* ─────────────────────────────────────────────────────────\n   Network-sphere — software, electric palette, depth, particles\n   ───────────────────────────────────────────────────────── */\n(() => {\n  const cvs = document.getElementById('scene');\n  const ctx = cvs.getContext('2d');\n  let W=0, H=0, DPR=Math.min(2, window.devicePixelRatio||1);\n  let mx=0, my=0, tmx=0, tmy=0;\n\n  function resize(){\n    W = cvs.clientWidth = window.innerWidth;\n    H = cvs.clientHeight = window.innerHeight;\n    cvs.width = W*DPR; cvs.height = H*DPR;\n    ctx.setTransform(DPR,0,0,DPR,0,0);\n  }\n  window.addEventListener('resize', resize);\n  resize();\n\n  window.addEventListener('pointermove', e => {\n    tmx = (e.clientX / W - 0.5);\n    tmy = (e.clientY / H - 0.5);\n  });\n\n  const N = 880;\n  const pts = [];\n  const golden = Math.PI * (3 - Math.sqrt(5));\n  for (let i=0;i<N;i++){\n    const y = 1 - (i/(N-1))*2;\n    const r = Math.sqrt(1-y*y);\n    const t = golden*i;\n    pts.push({x:Math.cos(t)*r, y:y, z:Math.sin(t)*r});\n  }\n  const edges = [];\n  for (let i=0;i<N;i++){\n    for (let j=i+1;j<N;j++){\n      const dx=pts[i].x-pts[j].x, dy=pts[i].y-pts[j].y, dz=pts[i].z-pts[j].z;\n      const d=dx*dx+dy*dy+dz*dz;\n      if (d<0.012){ edges.push([i,j]); }\n    }\n  }\n\n  // Stars\n  const stars = [];\n  for (let i=0;i<240;i++){\n    stars.push({\n      x:Math.random(), y:Math.random(),\n      s:Math.random()*1.2+0.3,\n      tw:Math.random()*Math.PI*2,\n    });\n  }\n\n  // Drifting depth particles\n  const particles = [];\n  for (let i=0;i<180;i++){\n    particles.push({\n      x:(Math.random()-0.5)*4,\n      y:(Math.random()-0.5)*2.4,\n      z:(Math.random()-0.5)*4,\n      s:Math.random()*0.5+0.2,\n    });\n  }\n\n  let frame = 0;\n  function project(p, rotY, rotX, scale){\n    let cy=Math.cos(rotY), sy=Math.sin(rotY);\n    let x = p.x*cy - p.z*sy;\n    let z = p.x*sy + p.z*cy;\n    let y = p.y;\n    let cx=Math.cos(rotX), sx=Math.sin(rotX);\n    let y2 = y*cx - z*sx;\n    let z2 = y*sx + z*cx;\n    const f = 4 / (4 + z2);\n    return { sx: x*scale*f, sy: y2*scale*f, depth:z2, f, nx:x, ny:y2, nz:z2 };\n  }\n\n  function loop(){\n    frame++;\n    mx += (tmx - mx)*0.04;\n    my += (tmy - my)*0.04;\n\n    ctx.fillStyle = 'rgba(4,6,12,0.22)';\n    ctx.fillRect(0,0,W,H);\n\n    const cx = W*0.50;\n    const cy = H*0.44;\n    const baseR = Math.min(W,H)*0.30;\n\n    // Stars\n    for (const s of stars){\n      const tw = 0.5 + 0.5*Math.sin(frame*0.02 + s.tw);\n      ctx.fillStyle = `rgba(180,210,255,${0.20*tw})`;\n      ctx.fillRect(s.x*W, s.y*H, s.s, s.s);\n    }\n\n    // Light direction\n    const lx=-0.55, ly=-0.55, lz=-0.62;\n    const llen = Math.hypot(lx,ly,lz);\n    const Lx=lx/llen, Ly=ly/llen, Lz=lz/llen;\n\n    const rotY = frame*0.0014 + mx*0.5;\n    const rotX = -0.10 + my*0.35;\n    const scale = baseR;\n\n    ctx.save();\n    ctx.translate(cx, cy);\n\n    // Particles\n    for (const p of particles){\n      p.z -= 0.0035;\n      if (p.z < -2) p.z = 2;\n      const proj = project(p, rotY*0.4, rotX*0.4, scale*1.3);\n      const a = Math.max(0, Math.min(1, (proj.f-0.5)*1.4));\n      ctx.fillStyle = `rgba(180,210,255,${0.18*a})`;\n      ctx.fillRect(proj.sx, proj.sy, p.s*proj.f*1.4, p.s*proj.f*1.4);\n    }\n\n    const projected = pts.map(p => project(p, rotY, rotX, scale));\n\n    // Edges — electric blue/cyan\n    ctx.lineWidth = 0.55;\n    for (const [i,j] of edges){\n      const a = projected[i], b = projected[j];\n      const la = Math.max(0, -(a.nx*Lx + a.ny*Ly + a.nz*Lz));\n      const lb = Math.max(0, -(b.nx*Lx + b.ny*Ly + b.nz*Lz));\n      const lit = (la+lb)/2;\n      const front = Math.max(0, -(a.depth+b.depth)/2);\n      if (lit < 0.08 && front < 0.30) continue;\n      const alpha = Math.min(1, 0.06 + lit*0.6 + front*0.12);\n      const r = Math.round(80 + lit*120);\n      const g = Math.round(160 + lit*70);\n      const bl = 255;\n      ctx.strokeStyle = `rgba(${r},${g},${bl},${alpha*0.7})`;\n      ctx.beginPath();\n      ctx.moveTo(a.sx, a.sy);\n      ctx.lineTo(b.sx, b.sy);\n      ctx.stroke();\n    }\n\n    // Vertices\n    for (let i=0;i<projected.length;i++){\n      const v = projected[i];\n      const lit = Math.max(0, -(v.nx*Lx + v.ny*Ly + v.nz*Lz));\n      const front = v.depth < 0;\n      if (!front && lit < 0.1) continue;\n      const r = front ? 1.4 : 0.6;\n      const a = 0.22 + lit*0.78;\n      if (lit > 0.7){\n        ctx.fillStyle = `rgba(225,240,255,${a})`;\n      } else {\n        ctx.fillStyle = `rgba(${130+lit*95},${190+lit*50},255,${a})`;\n      }\n      ctx.beginPath();\n      ctx.arc(v.sx, v.sy, r*v.f, 0, Math.PI*2);\n      ctx.fill();\n    }\n\n    // Cool core glow\n    const core = ctx.createRadialGradient(0, 0, 0, 0, 0, baseR*1.3);\n    core.addColorStop(0, 'rgba(124,220,255,0.18)');\n    core.addColorStop(0.5, 'rgba(58,123,255,0.06)');\n    core.addColorStop(1, 'rgba(0,0,0,0)');\n    ctx.fillStyle = core;\n    ctx.fillRect(-W,-H,W*2,H*2);\n\n    // Cyan rim\n    const rim = ctx.createRadialGradient(0, 0, baseR*0.9, 0, 0, baseR*1.18);\n    rim.addColorStop(0, 'rgba(124,220,255,0)');\n    rim.addColorStop(0.55, 'rgba(124,220,255,0.18)');\n    rim.addColorStop(1, 'rgba(58,123,255,0)');\n    ctx.fillStyle = rim;\n    ctx.fillRect(-W,-H,W*2,H*2);\n\n    // White spec upper-left\n    const spec = ctx.createRadialGradient(-baseR*0.5, -baseR*0.5, 0, -baseR*0.5, -baseR*0.5, baseR*0.7);\n    spec.addColorStop(0, 'rgba(220,235,255,0.18)');\n    spec.addColorStop(1, 'rgba(0,0,0,0)');\n    ctx.fillStyle = spec;\n    ctx.fillRect(-W,-H,W*2,H*2);\n\n    ctx.restore();\n\n    requestAnimationFrame(loop);\n  }\n  requestAnimationFrame(loop);\n\n  // clock\n  function tick(){\n    const d = new Date();\n    const pad = n => String(n).padStart(2,'0');\n    const el = document.getElementById('clock');\n    if (el) el.textContent = `${pad(d.getUTCHours())}:${pad(d.getUTCMinutes())}:${pad(d.getUTCSeconds())} UTC`;\n  }\n  tick(); setInterval(tick,1000);\n})();\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
